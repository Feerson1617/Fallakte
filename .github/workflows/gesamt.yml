name: Fallakte · Drei Unterrichtsmodule
on:
  push:
    branches: [integration/drei-unterrichtsmodule, korrektur/sprachfassung-drei-module, korrektur/persoenlicher-lernweg]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    container: mcr.microsoft.com/playwright/python:v1.62.0-noble
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Prüfwerkzeuge
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          python -m pip install -r tests/requirements.txt
          if ! command -v pdftotext >/dev/null; then
            apt-get update -qq
            apt-get install -y --no-install-recommends poppler-utils
          fi
      - run: python gesamt/auslieferung.py
      - run: python gesamt/endvergleich.py
      - run: python gesamt/pdfvergleich.py gesamt/pruefgrundlagen/Pflichtlernboegen_25-11.zip
      - run: python gesamt/hilfenvergleich.py
      - run: python gesamt/workseiten.py
      - run: python gesamt/papierwege.py
      - run: python gesamt/layout_scan.py
      - run: python gesamt/bildtexte.py
      - run: python -u gesamt/beratung_scan.py
      - run: python -u gesamt/unterricht.py
      - name: Stationswege und freiwillige Fälle
        run: |
          FALLAKTE_ZUSATZ_HTML=dist/Gesamt/Fallakte-02-12.html PYTHONPATH=gesamt:tests python -u - <<'PYCODE'
          from leseprotokoll import Aufzeichnung
          import pruefen, vertiefungen
          for name, suite in [('Stationsansichten', pruefen), ('Zusatzdialoge', vertiefungen)]:
              with Aufzeichnung(name): suite.run()
          PYCODE
      - name: Pflichtwege, persönliche Prüfung und Wiederaufnahme
        run: |
          for engine in chromium webkit; do
            python -u gesamt/familien_scan.py "$engine" verlauf
            python -u gesamt/familien_scan.py "$engine" tandem
          done
      - name: Gleiche Eingaben in Referenz und Kandidat
        run: |
          python gesamt/paarvergleich.py PREP
          python gesamt/paarvergleich.py UB02
          python gesamt/familien_paar.py
          python gesamt/zusatz_paar.py
      - run: python gesamt/endvertrag.py
      - run: python gesamt/rueckfall.py
      - run: python gesamt/endbericht.py
      - uses: actions/upload-artifact@v4
        with:
          name: Fallakte-Sprachpruefung-${{ github.sha }}
          path: dist/Gesamt/
          if-no-files-found: error
          retention-days: 90
