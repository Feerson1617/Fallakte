name: Unterrichtspakete
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unterricht:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tests/requirements.txt
      - run: python -m pip install -r tests/requirements.txt
      - run: python -m playwright install --with-deps chromium webkit
      - run: python scripts/build.py
      - run: python tests/acceptance.py
      - run: python scripts/worksheets.py
      - run: python tests/worksheets.py
      - run: python scripts/review.py
      - uses: actions/upload-artifact@v4
        with:
          name: Fallakte-Unterricht
          path: |
            dist/Fallakte.html
            dist/Fallakte-SCORM12.zip
            dist/Fallakte-Sichtpruefung.zip
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: Fallakte-Laufzettel
          path: dist/Laufzettel/*.pdf
          if-no-files-found: error
          retention-days: 30
