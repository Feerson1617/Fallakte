name: Gemeinsame Unterrichtstage
on:
  pull_request:
  push:
    branches: [main, entwicklung/gemeinsame-tagesauswahl, entwicklung/laura-nachrichten-08-12]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unterricht:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tests/requirements.txt
      - run: python -m pip install -r tests/requirements.txt
      - run: python -m playwright install --with-deps chromium webkit
      - run: python scripts/build.py
      - run: python tests/acceptance.py
      - run: python tests/lernhilfen.py
      - run: python tests/layout.py
      - run: python tests/content.py
      - run: python tests/recovery.py
      - run: python scripts/review.py
      - run: python tests/tagesauswahl.py
      - run: python scripts/tagesbericht.py
      - run: python tests/nachrichten.py
      - run: python scripts/nachrichtenbericht.py
      - uses: actions/upload-artifact@v4
        with:
          name: Fallakte-Version-A-02-12
          path: dist/Version-A/
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: Fallakte-Version-B-08-12
          path: dist/Version-B/
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: Fallakte-Abnahme
          path: |
            dist/Fallakte-Pruefbericht.md
            dist/Fallakte-Sichtpruefung.zip
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: Fallakte-Nachrichten-08-12
          path: |
            dist/Nachrichten-Pruefbericht.md
            dist/Nachrichten-Sichtpruefung.zip
            dist/Materialuebergabe-Work.zip
          if-no-files-found: error
          retention-days: 30
