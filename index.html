<html lang="de">
<head>

  <title>Fallakte.</title>
  <link rel="stylesheet" href="tagesauswahl/start.css">
</head>
<body>
  <main id="auswahl" aria-labelledby="titel">

    <div class="tage">
      <h2>
        <button class="tag" id="erster-tag" aria-labelledby="datum-02" data-entry="02-12.html">
          <img width="480" height="480" src="assets/laura.webp" alt="Porträt von Laura">
          <span class="beschriftung"><span id="datum-02">Mittwoch, 02.12.2026</span><span class="zeichen" aria-hidden="true"></span></span>

      </h2>
      <h2>
        <button class="tag" id="zweiter-tag" aria-labelledby="datum-08" disabled>

        </button>
      </h2>
    </div>
  </main>
  <section id="arbeitsplatz" aria-label="Gewählter Unterrichtstag" hidden>
    <nav aria-label="Unterrichtstage"><button id="zurueck" type="button"><span aria-hidden="true">←</span> Zur Tagesauswahl</button></nav>
